<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Buggy rolls, hill assignments, and the 2026–27 season in numbers.">
<title>Buggy Rolls | 2026–27</title>
<link rel="stylesheet" href="style.css">
<script defer src="data.js"></script>
<script defer src="app.js"></script>
</head>
<body>
<header><div class="shell top"><a class="brand" href="#overview"><span aria-hidden="true">◉</span> Buggy Rolls</a><nav aria-label="Dashboard"><a href="#overview">Overview</a><a href="#explore">Explore</a></nav></div></header>
<main class="shell">
<section id="overview">
<div class="intro"><p class="season">2026–27 season</p><h1>Rolls in review</h1><p>Team totals from the rolls log.</p></div>
<div class="stats" id="stats"></div>
<div class="charts">
<article class="card"><h2>Assignments by hill</h2><div id="hill-bars" class="bars"></div></article>
<article class="card"><h2>Runs per rolls day</h2><p class="muted">Completed log entries, excluding scratches.</p><div id="days" class="days"></div></article>
</div>
</section>
<section id="explore" hidden>
<div class="intro"><p class="season">2026–27 season</p><h1>Explore the hills</h1></div>
<div class="card">
<div class="controls">
<label>Group by<select id="mode"><option value="hill">Hill</option><option value="pusher">Pusher</option></select></label>
<label><span id="selection-label">Hill</span><select id="selection"></select></label>
<label>Emoji set<select id="theme"><option value="course">Course</option><option value="weather">Weather</option><option value="fruit">Fruit</option><option value="space">Space</option><option value="animals">Animals</option></select></label>
<label>Chart style<select id="style"><option value="pie">Pie</option><option value="donut">Donut</option></select></label>
</div>
<div class="breakdown"><div class="wheel" id="wheel"></div><div><h2 id="chart-title" aria-live="polite"></h2><p id="chart-note" class="muted"></p><ul id="legend"></ul></div></div>
</div>
</section>
<footer>Season snapshot · November 23, 2026</footer>
</main>
</body>
</html>
